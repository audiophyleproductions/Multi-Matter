name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore USBFormatter.csproj
      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          dotnet publish USBFormatter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o dist
          if (-not (Test-Path dist/MultiMatter.exe)) { throw 'MultiMatter.exe was not produced' }
          Get-FileHash dist/MultiMatter.exe -Algorithm SHA256 | Format-List
      - name: Upload Windows binary (test artifact, not public release)
        uses: actions/upload-artifact@v4
        with:
          name: MultiMatter-win-x64-release-candidate
          path: dist/MultiMatter.exe
          if-no-files-found: error
