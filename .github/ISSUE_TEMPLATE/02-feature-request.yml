name: Feature request
description: Suggest a focused improvement to Multi-Matter.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Describe your workflow and the problem, rather than only a proposed button.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checks
      options:
        - label: I checked existing feature requests.
          required: true
